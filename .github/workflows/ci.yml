name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go mod download
      - run: go build ./...
        working-directory: server-go
      - run: go test ./... -count=1
        working-directory: server-go
      - name: gofmt
        run: |
          [ -z "$(gofmt -l server-go)" ] || (gofmt -d server-go && exit 1)
  lint-build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
        working-directory: web
        continue-on-error: true
