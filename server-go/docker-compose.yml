# SafeGram API + PostgreSQL + Caddy (Sprintbox / любой VDS)
# Перед запуском: скопируй .env.sprintbox.example в .env и заполни значения.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safegram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: safegram
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safegram -d safegram"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: postgres://safegram:${POSTGRES_PASSWORD}@postgres:5432/safegram?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
