# Бэкенд без сборки Go на сервере. Нужен готовый бинарник server-go/main.
# Сборка бинарника локально: cd server-go && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o main .

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-safegram}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-safegram_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-safegram}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safegram_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safegram_network

  backend:
    build:
      context: ./server-go
      dockerfile: Dockerfile.runtime
    image: safegram-api-backend:latest
    restart: unless-stopped
    env_file:
      - ./server-go/.env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://${DB_USER:-safegram}:${DB_PASSWORD}@db:5432/${DB_NAME:-safegram_prod}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health", "-O", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - safegram_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  server_uploads:
    driver: local

networks:
  safegram_network:
    driver: bridge
